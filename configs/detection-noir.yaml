# Use with --tuning-file pointing to the matching NoIR ISP JSON.
width: 640
height: 480
min_area: 50
max_area: 5000
# Starting thresholds for camera-side NoIR tuning; validate under your lighting.
min_confidence: 0.0
min_circularity: 0.55
min_color_contrast: 12.0
morphology:
  open_kernel: 3
  close_kernel: 5
colors:
  red:
    hue_ranges:
      - [0, 18]
      - [168, 180]
    saturation_min: 60
    saturation_max: 255
    value_min: 30
    value_max: 255
  green:
    hue_ranges:
      - [27, 90]
    saturation_min: 60
    saturation_max: 255
    value_min: 60
    value_max: 255
  blue:
    hue_ranges:
      - [90, 130]
    saturation_min: 80
    saturation_max: 255
    value_min: 60
    value_max: 255
