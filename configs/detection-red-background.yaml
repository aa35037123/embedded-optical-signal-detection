# Bright display targets against the current Pi/IMX219 reddish background.
# Tuned against both red_cast_phone*.png regression captures; not a camera color correction.
# Shape and local-contrast gates reject thin edges and weak background fragments.
# Green includes yellow-shifted dots; blue includes purple-shifted dots.
# Red targets measured near S=255; pink background measured around S=200-220.
width: 640
height: 480
min_area: 50
max_area: 5000
# Confidence mixes shape and brightness; keep diagnostic-only for color-shifted cameras.
min_confidence: 0.0
min_circularity: 0.55
min_color_contrast: 12.0
morphology:
  open_kernel: 3
  close_kernel: 5
colors:
  red:
    hue_ranges:
      - [0, 12]
      - [166, 179]
    saturation_min: 230
    saturation_max: 255
    value_min: 180
    value_max: 255
  green:
    hue_ranges:
      - [24, 89]
    saturation_min: 80
    saturation_max: 255
    value_min: 60
    value_max: 255
  blue:
    hue_ranges:
      - [90, 150]
    saturation_min: 80
    saturation_max: 255
    value_min: 60
    value_max: 255
