# Bright display targets against the current Pi/IMX219 reddish background.
# Tuned against tests/fixtures/red_cast_phone.png; not a camera color correction.
# Shape and local-contrast gates reject thin edges and weak background fragments.
# Green includes the yellow-shifted camera values observed in that capture.
width: 640
height: 480
min_area: 50
max_area: 5000
# Confidence mixes shape and brightness; keep diagnostic-only for color-shifted cameras.
min_confidence: 0.0
min_circularity: 0.55
min_color_contrast: 12.0
morphology:
  open_kernel: 3
  close_kernel: 5
colors:
  red:
    hue_ranges:
      - [0, 12]
      - [166, 179]
    saturation_min: 140
    saturation_max: 255
    value_min: 180
    value_max: 255
  green:
    hue_ranges:
      - [24, 89]
    saturation_min: 80
    saturation_max: 255
    value_min: 60
    value_max: 255
  blue:
    hue_ranges:
      - [90, 130]
    saturation_min: 80
    saturation_max: 255
    value_min: 60
    value_max: 255
