# Starting point for bright red display targets against a dim reddish background.
# Not a calibrated NoIR profile: verify with raw camera pixels and debug masks.
# Raise red value_min above background V while keeping it below target V.
# A stricter threshold may reject dim targets. Other color/area settings are unchanged.
width: 640
height: 480
min_area: 50
max_area: 5000
# Confidence mixes shape and brightness; keep diagnostic-only for color-shifted cameras.
min_confidence: 0.0
morphology:
  open_kernel: 3
  close_kernel: 5
colors:
  red:
    hue_ranges:
      - [0, 12]
      - [168, 180]
    saturation_min: 140
    saturation_max: 255
    value_min: 180
    value_max: 255
  green:
    hue_ranges:
      - [36, 90]
    saturation_min: 80
    saturation_max: 255
    value_min: 60
    value_max: 255
  blue:
    hue_ranges:
      - [90, 130]
    saturation_min: 80
    saturation_max: 255
    value_min: 60
    value_max: 255
